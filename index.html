<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défis Photobooth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* Fond bleu nuit en dégradé */
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 20px;
      text-align: center;
    }

    /* En-tête */
    header {
      margin-bottom: 25px;
    }

    .logo {
      max-width: 100px;
      height: auto;
      margin-bottom: 12px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Titre en dégradé Bleu / Cyan / Blanc */
    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #00d2ff, #3a7bd5, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 15px rgba(0, 210, 255, 0.3);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #d1e8ff;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* La carte de défi */
    .card-container {
      width: 100%;
      max-width: 330px;
      height: 220px;
      margin-bottom: 30px;
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(0, 210, 255, 0.3);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.4;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    /* Halo néon bleu au moment de l'arrêt */
    .card.stopped {
      border-color: #00d2ff;
      background: rgba(0, 210, 255, 0.15);
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
    }

    /* Le bouton bleu vibrant */
    button {
      width: 100%;
      max-width: 290px;
      padding: 16px 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(45deg, #00d2ff, #3a7bd5);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <!-- <img src="logo.png" alt="Logo" class="logo"> -->
    <h1>Défis Photobooth</h1>
    <p class="subtitle">Flashe, tire ton défi et pose ! 📸</p>
  </header>

  <div class="card-container">
    <div class="card" id="card">Touche le bouton pour commencer</div>
  </div>

  <button id="actionBtn" onclick="toggleLoop()">START</button>

  <script>
    const defis = [
      "Tire les oreilles à Ludo !",
      "Ho yeah !!!",
      "C'est vrai qu'il est con ce gruat",
      "Gloria tu es nulle !",
      "I love you Maude",
      "Haribo c'est beau la vie",
      "Christopher tu es laid",
      "C'est vrai qu'il est gros Pascal"
    ];

    let intervalId = null;
    let isRunning = false;
    const card = document.getElementById('card');
    const btn = document.getElementById('actionBtn');

    function toggleLoop() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        btn.innerText = "RECOMMENCER";
        btn.style.background = "linear-gradient(45deg, #00d2ff, #3a7bd5)";
        card.classList.add('stopped');
      } else {
        card.classList.remove('stopped');
        isRunning = true;
        btn.innerText = "STOP !";
        btn.style.background = "linear-gradient(45deg, #ff416c, #ff4b2b)"; /* Rouge/Orange pétant pendant le tirage */
        
        intervalId = setInterval(() => {
          const randomIndex = Math.floor(Math.random() * defis.length);
          card.innerText = defis[randomIndex];
        }, 50);
      }
    }
  </script>

</body>
</html>
