<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DÉFIS PHOTOBOOTH</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center; /* Centre tout le bloc au milieu verticalement */
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    /* Conteneur principal regroupant tout le jeu */
    .app-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 1. SECTION LOGO + TITRE */
    header {
      margin-bottom: 25px; /* Espacement fixe et contrôlé sous le titre */
    }

    /* Emplacement du logo */
    .logo {
      max-width: 90px;
      height: auto;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 6px;
    }

    /* 2. SECTION CARRIER DE DÉFI */
    .card-container {
      width: 100%;
      height: 220px;
      margin-bottom: 25px; /* Espacement équilibré entre le carré et le bouton */
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #ec4899;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
      box-shadow: 0 0 25px #ec489966;
      transition: all 0.3s ease;
    }

    .card.stopped {
      transform: scale(1.03);
    }

    /* 3. SECTION BOUTON START / STOP */
    button {
      width: 100%;
      max-width: 280px;
      padding: 16px 0;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(45deg, #ec4899, #8b5cf6);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <!-- Pour afficher votre logo plus tard, il suffira de retirer les "<!--" ci-dessous : -->
      <!-- <img src="logo.png" alt="Logo" class="logo"> -->
      <h1>DÉFIS PHOTOBOOTH</h1>
      <p class="subtitle">Flashe, tire ton défi et pose ! 📸</p>
    </header>

    <div class="card-container">
      <div class="card" id="card">Touche le bouton pour commencer</div>
    </div>

    <button id="actionBtn" onclick="toggleLoop()">LANCER</button>
  </div>

  <script>
    const defis = [
      "Fais une grimace hilarante !",
      "Pose comme une star de cinéma",
      "Reconstitue une scène d'action à 2",
      "Fais la plus belle pose rétro/80s",
      "Porte le plus d'accessoires possible",
      "Fais un bisou sur la joue de ton voisin",
      "Fais une pose 'Secret Agent' avec tes lunettes",
      "Saute en l'air au moment du cliché !"
    ];

    let intervalId = null;
    let isRunning = false;
    const card = document.getElementById('card');
    const btn = document.getElementById('actionBtn');

    function toggleLoop() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        btn.innerText = "RECOMMENCER";
        btn.style.background = "linear-gradient(45deg, #ec4899, #8b5cf6)";
        card.classList.add('stopped');
        if (typeof confetti === "function") confetti({ particleCount: 70, spread: 60, origin: { y: 0.65 } });
      } else {
        card.classList.remove('stopped');
        isRunning = true;
        btn.innerText = "STOP !";
        btn.style.background = "linear-gradient(45deg, #f7b731, #eb3b5a)";
        
        intervalId = setInterval(() => {
          const randomIndex = Math.floor(Math.random() * defis.length);
          card.innerText = defis[randomIndex];
        }, 50);
      }
    }
  </script>

</body>
</html>
