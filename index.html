<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défis photobooth</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #311042 0%, #701a75 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 30px 10px;
      text-align: center;
    }

    header {
      margin-top: 10px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 6px;
    }

    .card-container {
      width: 100%;
      max-width: 340px;
      height: 230px;
      margin: 30px 0;
    }

    .card {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #f43f5e;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
      box-shadow: 0 0 25px #f43f5e66;
      transition: all 0.3s ease;
    }

    .card.stopped {
      transform: scale(1.03);
    }

    button {
      width: 100%;
      max-width: 300px;
      padding: 18px 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(45deg, #a855f7, #ec4899);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      margin-bottom: 12px;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <header>
    <h1>Défis photobooth</h1>
    <p class="subtitle">Seras tu prêt(e) à relever le défi ?</p>
  </header>

  <div class="card-container">
    <div class="card" id="card">Touche le bouton pour commencer</div>
  </div>

  <button id="actionBtn" onclick="toggleLoop()">LANCER</button>

  <script>
    const defis = [
      "Fais une grimace hilarante !",
      "Prends une photo avec le DJ",
      "Prends une photo grimace",
      "Prends une photo que tu n'oserais pas publier sur les réseaux",
      "Prends une photo hilarante",
      "Prends une photo avec \"l'air dégouté d'être la\""
];

    let intervalId = null;
    let isRunning = false;
    const card = document.getElementById('card');
    const btn = document.getElementById('actionBtn');

    function toggleLoop() {
      if (isRunning) {
        clearInterval(intervalId);
        isRunning = false;
        btn.innerText = "RECOMMENCER";
        btn.style.background = "linear-gradient(45deg, #a855f7, #ec4899)";
        card.classList.add('stopped');
        if (typeof confetti === "function") confetti({ particleCount: 70, spread: 60, origin: { y: 0.65 } });
      } else {
        card.classList.remove('stopped');
        isRunning = true;
        btn.innerText = "STOP !";
        btn.style.background = "linear-gradient(45deg, #f7b731, #eb3b5a)";
        
        intervalId = setInterval(() => {
          const randomIndex = Math.floor(Math.random() * defis.length);
          card.innerText = defis[randomIndex];
        }, 50);
      }
    }
  </script>

</body>
</html>
